; PlatformIO 工程：赛博需求翻译机下位机（STM32F103C8 / Black Pill）
;
; 功能：UART1（PA9/PA10，9600 8N1）接收上位机指令：
;   'O' → 绿灯亮 + OLED「需求通过」
;   'E' → 红灯狂闪 + 蜂鸣器 + OLED「极度离谱 / 拒绝接入」
;
; 烧录：pio run -t upload（需要 ST-Link，SWD 接口）

[env:blackpill_f103c8]
platform = ststm32
board = blackpill_f103c8
framework = stm32cube
upload_protocol = custom
upload_command = openocd -f interface/stlink.cfg -f target/stm32f1x.cfg -c "transport select swd" -c "program {.pio/build/blackpill_f103c8/firmware.elf} verify reset exit"
monitor_speed = 9600
